<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Planner — תצוגה מקדימה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   מערכת עיצוב אחת. כל טוקן מוגדר פעם אחת ב-:root, ו-[data-theme=dark]
   מגדיר מחדש ערכים בלבד — לא טוקנים חדשים. אין שכבה שדורסת שכבה.
   ============================================================ */
:root{
 /* משטחים */
 --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#F7F9FC; --surface-3:#EDF1F7;
 --nav:#172B45; --nav-2:#1F3A5C; --nav-ink:#C7D6EA; --nav-ink-on:#FFFFFF;
 --line:#DDE4ED; --line-2:#E9EEF4; --ring:#C3D2E6;
 /* דיו */
 --ink:#101828; --ink-2:#475467; --ink-3:#5D6878; --on-fill:#FFFFFF;
 /* סמנטיקה — צבע מילוי מול צבע טקסט, בנפרד.
    הכתום המקורי #B76A08 נותן 3.81 על הרקע הכללי; לטקסט נדרש 4.5.
    לכן: מילוי=#B76A08 (רכיב גרפי, סף 3), טקסט=#9A5806 (5.14). */
 --crit:#C93636;  --crit-tx:#B02B2B;  --crit-bg:#FDECEC; --crit-line:#F3C4C4;
 --warn:#B76A08;  --warn-tx:#9A5806;  --warn-bg:#FDF3E3; --warn-line:#F0D9AE;
 --done:#207653;  --done-tx:#1B6446;  --done-bg:#E8F5EE; --done-line:#B9DFCB;
 --param:#7357B5; --param-tx:#63489F; --param-bg:#F1ECFA; --param-line:#D9CCEF;
 --acc:#2563EB;   --acc-tx:#1D4FD0;   --acc-bg:#E8F0FE; --acc-line:#C2D6FB;
 --neutral:#5B6B7F; --neutral-bg:#EEF1F5;
 /* גרפים — «קיים» אפור־צפחה מול «מוצע» סגול, מופרדים גם בצורה */
 --c-now:#334155; --c-sug:#7357B5; --c-bar:#5B6B7F; --c-track:#E3E9F1;
 /* מידות */
 --top-h:52px; --nav-w:224px; --r:8px; --r-sm:5px;
 --row-h:34px; --row-h-tight:27px;
 --f-xs:11px; --f-sm:12px; --f-md:13px; --f-lg:15px; --f-xl:19px; --f-hero:30px;
 --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
 --shadow-lg:0 8px 24px rgba(16,24,40,.12);
 --num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
 --bg:#0F1720; --surface:#17212E; --surface-2:#1C2735; --surface-3:#243144;
 --nav:#0B131C; --nav-2:#16222F; --nav-ink:#93A6BE; --nav-ink-on:#FFFFFF;
 --line:#2A3949; --line-2:#222F3E; --ring:#3A4C61;
 --ink:#E8EDF5; --ink-2:#9BA8BC; --ink-3:#8B9AB0; --on-fill:#0B131C;
 --crit:#FF7B7B; --crit-tx:#FF9B9B; --crit-bg:#3A1E20; --crit-line:#5C2E31;
 --warn:#F0A93C; --warn-tx:#F5BC63; --warn-bg:#3A2C15; --warn-line:#5C4622;
 --done:#4FC48A; --done-tx:#6FD3A1; --done-bg:#17301F; --done-line:#265037;
 --param:#B49BEA; --param-tx:#C4B0F0; --param-bg:#2A2340; --param-line:#443666;
 --acc:#6BA0FF;  --acc-tx:#8DB6FF;  --acc-bg:#16263F; --acc-line:#274263;
 --neutral:#9BA8BC; --neutral-bg:#222F3E;
 --c-now:#9BA8BC; --c-sug:#B49BEA; --c-bar:#7E8DA3; --c-track:#26344A;
 --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 var(--f-md)/1.45 Heebo,system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;overflow:hidden}
/* מספרים מיושרים — טבלאיים בכל מקום שמציג כמות */
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}

/* ==================== סרגל עליון ==================== */
.top{height:var(--top-h);background:var(--surface);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:10px;padding-inline:12px;position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:var(--f-md);white-space:nowrap}
.brand i{width:24px;height:24px;border-radius:6px;background:var(--nav);color:#FFFFFF;
 display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.search{flex:1 1 260px;max-width:420px;position:relative}
.search input{width:100%;height:32px;border:1px solid var(--line);border-radius:var(--r-sm);
 background:var(--surface-2);padding-inline:30px 10px;font-size:var(--f-md)}
.search input::placeholder{color:var(--ink-3)}
.search .ic{position:absolute;inset-inline-start:9px;inset-block-start:7px;color:var(--ink-3);font-size:13px}
.tsel{display:flex;gap:6px}
.tsel select{height:32px;border:1px solid var(--line);border-radius:var(--r-sm);
 background:var(--surface-2);padding-inline:8px 24px;font-size:var(--f-sm);max-width:130px}
/* תאריך דוח מול מועד העלאה — שתי עובדות שונות, ולכן שתי שורות */
.stamp{display:flex;gap:7px;margin-inline-start:auto}
.stamp .card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
 padding:3px 9px;min-width:104px}
.stamp .k{font-size:10px;color:var(--ink-2);font-weight:600;letter-spacing:.02em;
 display:flex;align-items:center;gap:4px}
.stamp .v{font-size:var(--f-sm);font-weight:700;line-height:1.25}
.stamp .sub{font-size:10px;color:var(--ink-2);line-height:1.25}
.stamp .card.none{background:var(--warn-bg);border-color:var(--warn-line)}
.stamp .card.none .v{color:var(--warn-tx)}
.tbtn{height:32px;padding-inline:11px;border:1px solid var(--line);border-radius:var(--r-sm);
 background:var(--surface);font-size:var(--f-sm);font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:var(--surface-2)}
.tbtn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-fill)}
.tbtn.ico{padding-inline:8px}

/* ==================== שלד ==================== */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;height:calc(100% - var(--top-h))}
/* ==================== ניווט קבוע בצד ימין ==================== */
.nav{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;overflow:auto}
.nav .sect{font-size:10px;font-weight:700;letter-spacing:.06em;color:#9DB2CC;
 padding:13px 14px 5px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 14px;color:inherit;text-decoration:none;
 border-inline-start:3px solid transparent;font-size:var(--f-md);position:relative}
.nav a .ni{width:17px;text-align:center;font-size:13px;opacity:.85;flex:0 0 auto}
.nav a .nt{flex:1;font-weight:500}
.nav a .nb{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--f-xs);font-weight:700;
 background:#27405C;color:#D8E4F2;border-radius:99px;padding:1px 7px;min-width:26px;text-align:center}
.nav a:hover{background:var(--nav-2);color:var(--nav-ink-on)}
.nav a.on{background:var(--nav-2);color:var(--nav-ink-on);border-inline-start-color:var(--acc);font-weight:700}
.nav a.on .nt{font-weight:700}
/* מונה אפס אינו מעלים את היעד — הוא משנה את מראה המונה */
.nav a .nb.zero{background:transparent;color:#93A9C4;border:1px solid #33506F}
.nav a.hot .nb{background:var(--crit);color:var(--on-fill)}
.nav .sp{flex:1}
.nav .foot{padding:10px 14px;border-block-start:1px solid #24394F;font-size:var(--f-xs);color:#9DB2CC}
.nav .foot b{color:#B9CBE0}

/* ==================== אזור עבודה ==================== */
.work{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.crumb{display:flex;align-items:baseline;gap:10px;padding:8px 14px 0;flex-wrap:wrap}
.crumb h1{font-size:var(--f-lg);font-weight:800;margin:0}
.crumb .sub{font-size:var(--f-sm);color:var(--ink-2)}
.demo{margin-inline-start:auto;background:var(--warn-bg);border:1px solid var(--warn-line);
 color:var(--warn-tx);font-size:var(--f-xs);font-weight:700;border-radius:99px;padding:2px 10px}

/* רצועת מדדים קומפקטית */
.kpis{display:flex;gap:8px;padding:8px 14px;flex-wrap:wrap}
/* רצועת המדדים היא סיכום; הטבלה היא העבודה. במסך נמוך אפשר לקפל
   אותה ולהחזיר ~70px לשורות. המצב נשמר לכל תחום בנפרד. */
body.nokpi .kpis{display:none}
.kpitog{border:0;background:none;color:var(--ink-3);font-size:var(--f-xs);font-weight:700;
 padding:2px 6px;border-radius:var(--r-sm)}
.kpitog:hover{background:var(--surface-3);color:var(--ink-2)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
 padding:5px 11px;min-width:126px;display:flex;flex-direction:column;gap:1px;position:relative;
 border-inline-start:3px solid var(--c,var(--neutral));text-align:start}
.kpi:hover{box-shadow:var(--shadow)}
.kpi .kl{font-size:var(--f-xs);color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:4px}
.kpi .kv{font-size:20px;font-weight:800;line-height:1.1;font-family:var(--num);font-variant-numeric:tabular-nums}
.kpi .ks{font-size:11px;color:var(--ink-2);line-height:1.3}
.kpi.crit{--c:var(--crit)} .kpi.crit .kv{color:var(--crit-tx)}
.kpi.warn{--c:var(--warn)} .kpi.warn .kv{color:var(--warn-tx)}
.kpi.done{--c:var(--done)} .kpi.done .kv{color:var(--done-tx)}
.kpi.param{--c:var(--param)} .kpi.param .kv{color:var(--param-tx)}
.kpi.acc{--c:var(--acc)}

/* סרגל סינון מקומי */
.fbar{display:flex;align-items:center;gap:7px;padding:0 14px 8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:27px;padding-inline:9px;
 border:1px solid var(--line);border-radius:99px;background:var(--surface);
 font-size:var(--f-sm);font-weight:600;color:var(--ink-2)}
.chip:hover{border-color:var(--ring);background:var(--surface-2)}
.chip.on{background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc-tx)}
.chip .x{opacity:.6;font-weight:700}
.fbar .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 10px;font-size:var(--f-sm);font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--acc);color:var(--on-fill)}

/* ==================== הטבלה ==================== */
.tablewrap{flex:1;display:flex;min-height:0;padding:0 14px 12px;gap:10px}
.tcard{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
 border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.tscroll{flex:1;overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--f-md)}
thead th{position:sticky;inset-block-start:0;z-index:3;background:var(--surface-2);
 text-align:start;font-size:var(--f-xs);font-weight:700;color:var(--ink-2);
 padding:7px 9px;border-block-end:1px solid var(--line);white-space:nowrap;
 letter-spacing:.01em}
thead th.num,tbody td.num{text-align:end}
/* הקפאת מק״ט ותיאור */
th.f1,td.f1{position:sticky;inset-inline-start:0;z-index:2;background:var(--surface)}
th.f2,td.f2{position:sticky;inset-inline-start:96px;z-index:2;background:var(--surface)}
thead th.f1,thead th.f2{z-index:4;background:var(--surface-2)}
th.f2::after,td.f2::after{content:"";position:absolute;inset-block:0;inset-inline-end:0;
 width:1px;background:var(--line)}
tbody td{padding:5px 9px;border-block-end:1px solid var(--line-2);height:var(--row-h);
 vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:hover td.f1,tbody tr:hover td.f2{background:var(--surface-2)}
tbody tr.sel td{background:var(--acc-bg)}
tbody tr.sel td.f1,tbody tr.sel td.f2{background:var(--acc-bg)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
body.tight tbody td{height:var(--row-h-tight);padding-block:2px;font-size:var(--f-sm)}
.pn{font-family:var(--num);font-weight:700;font-size:var(--f-sm);letter-spacing:-.02em}
.desc{max-width:210px;overflow:hidden;text-overflow:ellipsis;display:block}
td.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.z{color:var(--ink-3)}
.unk{color:var(--ink-3);font-style:normal}
/* תא שנושא התרעה — סימון ממוקד, לא צביעת מסך */
.cell-crit{color:var(--crit-tx);font-weight:800}
.cell-warn{color:var(--warn-tx);font-weight:700}
/* תגיות */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--f-xs);font-weight:700;
 border-radius:var(--r-sm);padding:1px 7px;border:1px solid transparent;white-space:nowrap}
.tag.crit{background:var(--crit-bg);color:var(--crit-tx);border-color:var(--crit-line)}
.tag.warn{background:var(--warn-bg);color:var(--warn-tx);border-color:var(--warn-line)}
.tag.done{background:var(--done-bg);color:var(--done-tx);border-color:var(--done-line)}
.tag.param{background:var(--param-bg);color:var(--param-tx);border-color:var(--param-line)}
.tag.neutral{background:var(--neutral-bg);color:var(--ink-2);border-color:var(--line)}
.tag.acc{background:var(--acc-bg);color:var(--acc-tx);border-color:var(--acc-line)}
.act{font-size:var(--f-sm);color:var(--ink-2);max-width:230px;overflow:hidden;text-overflow:ellipsis;display:block}
.tfoot{border-block-start:1px solid var(--line);padding:6px 11px;font-size:var(--f-sm);
 color:var(--ink-2);display:flex;align-items:center;gap:12px;background:var(--surface-2)}

/* ==================== פאנל הפריט ==================== */
.panel{width:var(--pw,400px);flex:0 0 auto;background:var(--surface);border:1px solid var(--line);
 border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);position:relative}
.panel[hidden]{display:none}
.pgrip{position:absolute;inset-inline-end:-3px;inset-block:0;width:7px;cursor:col-resize;z-index:5}
.pgrip:hover{background:var(--acc-line)}
.phead{padding:9px 12px;border-block-end:1px solid var(--line);display:flex;align-items:center;gap:9px;
 background:var(--surface-2)}
.phead .pn{font-size:var(--f-lg)}
.phead .nav2{margin-inline-start:auto;display:flex;gap:3px}
.iconbtn{width:26px;height:26px;border:1px solid var(--line);border-radius:var(--r-sm);
 background:var(--surface);display:grid;place-items:center;font-size:13px;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-3)}
.pbody{flex:1;overflow:auto;padding:11px 12px;display:flex;flex-direction:column;gap:11px}
.psec{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.psec>h3{margin:0;font-size:var(--f-xs);font-weight:700;color:var(--ink-2);letter-spacing:.02em;
 padding:6px 10px;background:var(--surface-2);border-block-end:1px solid var(--line-2);
 display:flex;align-items:center;gap:6px}
.psec>.in{padding:10px}
/* 1 · הבעיה והפעולה — המספרים קודם */
.nums{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
 background:var(--surface-2)}
.nums div{flex:1;min-width:66px;padding:7px 9px;border-inline-end:1px solid var(--line-2);text-align:center}
.nums div:last-child{border-inline-end:0}
.nums .k{font-size:10px;color:var(--ink-3);font-weight:600}
.nums .v{font-size:var(--f-lg);font-weight:800;font-family:var(--num);font-variant-numeric:tabular-nums;line-height:1.2}
.nums .gap{background:var(--crit-bg)} .nums .gap .v{color:var(--crit-tx)}
.nums .gap .k{color:var(--crit-tx)}
.problem{background:var(--crit-bg);border:1px solid var(--crit-line);border-radius:var(--r);padding:9px 11px}
.problem.w{background:var(--warn-bg);border-color:var(--warn-line)}
.problem.p{background:var(--param-bg);border-color:var(--param-line)}
.problem.g{background:var(--done-bg);border-color:var(--done-line)}
.problem .t{font-size:var(--f-xs);font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.problem .a{font-size:var(--f-lg);font-weight:800;margin-block-start:2px;line-height:1.35}
.pacts{display:flex;gap:6px;margin-block-start:9px;flex-wrap:wrap}
.pacts button{height:30px;padding-inline:12px;border-radius:var(--r-sm);border:1px solid var(--line);
 background:var(--surface);font-size:var(--f-sm);font-weight:700}
.pacts button.pri{background:var(--acc);border-color:var(--acc);color:var(--on-fill)}
.reasons{display:flex;flex-direction:column;gap:5px}
.reason{display:flex;gap:7px;font-size:var(--f-sm);line-height:1.45;color:var(--ink-2)}
.reason .ri{flex:0 0 auto;font-size:11px;margin-block-start:2px}
.reason.err .ri{color:var(--crit-tx)} .reason.warn .ri{color:var(--warn-tx)}
.reason.ok .ri{color:var(--done-tx)} .reason.info .ri{color:var(--acc-tx)}
.reason.idea .ri{color:var(--param-tx)}
/* טבלת מפתח־ערך */
.kv{display:grid;grid-template-columns:1fr auto;gap:0}
.kv>*{padding:5px 9px;border-block-end:1px solid var(--line-2);font-size:var(--f-sm)}
.kv>*:nth-child(2n){text-align:end;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.kv>*:nth-last-child(-n+2){border-block-end:0}
.kv .lbl{color:var(--ink-2)}
/* מידע חסר */
.missing{background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);
 padding:8px 10px;font-size:var(--f-sm);color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.missing b{color:var(--ink)}

/* ==================== גרפים ==================== */
/* צריכה חודשית — סדרה אחת, ולכן בלי מקרא. הכותרת מזהה אותה.
   פיק וצניחה מסומנים בצבע סטטוס *וגם* בסמל — לעולם לא בצבע לבד. */
.bars{display:flex;align-items:flex-end;gap:3px;height:74px;padding-block-start:4px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bars .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bars .b{width:100%;max-width:19px;background:var(--c-bar);border-radius:4px 4px 0 0;min-height:2px;
 position:relative}
.bars .b.spike{background:var(--warn)} .bars .b.drop{background:var(--crit)}
.bars .lb{font-size:10px;color:var(--ink-2);font-family:var(--num)}
.bars .mk{position:absolute;inset-block-start:-13px;inset-inline-start:50%;transform:translateX(50%);
 font-size:10px;line-height:1}
.bars .b.spike .mk{color:var(--warn-tx)} .bars .b.drop .mk{color:var(--crit-tx)}
.chartnote{font-size:var(--f-xs);color:var(--ink-3);margin-block-start:6px;display:flex;gap:11px;flex-wrap:wrap}
.chartnote span{display:inline-flex;align-items:center;gap:4px}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block}
/* bullet — «קיים» מול «מוצע». קידוד לפי מיקום וצורה, לא לפי גוון בלבד. */
.bullet{display:flex;flex-direction:column;gap:9px}
.blt{display:grid;grid-template-columns:52px 1fr 78px;align-items:center;gap:9px}
.blt .bk{font-size:var(--f-sm);font-weight:700;color:var(--ink-2)}
.blt .tr{position:relative;height:19px;background:var(--c-track);border-radius:4px}
.blt .now{position:absolute;inset-block:4px;inset-inline-start:0;background:var(--c-now);border-radius:4px}
.blt .sug{position:absolute;inset-block:-2px;width:3px;background:var(--c-sug);border-radius:2px}
.blt .sug::after{content:"";position:absolute;inset-block-start:-4px;inset-inline-start:-3px;
 border:4px solid transparent;border-block-start-color:var(--c-sug)}
.blt .bv{font-size:var(--f-sm);font-family:var(--num);font-variant-numeric:tabular-nums;text-align:end}
.blt .bv b{color:var(--param-tx)}
/* ציר אספקות — בפועל / מתוכנן / בלי תאריך */
.tl{display:flex;flex-direction:column;gap:7px}
.tlrow{display:grid;grid-template-columns:86px 1fr;gap:9px;align-items:center}
.tlrow .tk{font-size:var(--f-xs);color:var(--ink-2);font-weight:600;text-align:start}
.tlbar{height:21px;border-radius:4px;display:flex;align-items:center;justify-content:center;
 font-size:var(--f-xs);font-weight:700;color:var(--on-fill);min-width:34px}
.tlbar.actual{background:var(--done)}
.tlbar.planned{background:var(--acc);
 background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 4px,transparent 4px 8px)}
.tlbar.nodate{background:var(--surface-3);color:var(--warn-tx);border:1px dashed var(--warn-line)}
.tlaxis{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-2);
 padding-block-start:3px;border-block-start:1px solid var(--line-2)}

/* ==================== מרכז העבודה ==================== */
.center{flex:1;overflow:auto;padding:0 14px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:10px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
 overflow:hidden;box-shadow:var(--shadow)}
.card>h2{margin:0;font-size:var(--f-md);font-weight:700;padding:9px 12px;
 border-block-end:1px solid var(--line-2);display:flex;align-items:center;gap:7px;background:var(--surface-2)}
.card>h2 .cnt{margin-inline-start:auto;font-family:var(--num);font-weight:800;font-size:var(--f-lg)}
.card>h2 a{margin-inline-start:auto;font-size:var(--f-sm);color:var(--acc-tx);text-decoration:none;font-weight:600}
.qlist{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;
 padding:7px 12px;border-block-end:1px solid var(--line-2);text-align:start;border:0;background:none;width:100%}
.qrow:last-child{border-block-end:0}
.qrow:hover{background:var(--surface-2)}
.qrow .qp{font-family:var(--num);font-weight:700;font-size:var(--f-sm);color:var(--ink)}
.qrow .qd{font-size:var(--f-sm);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .qv{font-family:var(--num);font-weight:800;font-size:var(--f-md);text-align:end;white-space:nowrap}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:var(--f-sm)}
.empty .ei{font-size:24px;display:block;margin-block-end:6px;opacity:.5}
/* כסף — לכל מטבע בנפרד, לעולם לא מחוברים */
.money{display:flex;gap:9px;flex-wrap:wrap;font-family:var(--num);font-variant-numeric:tabular-nums}
.money i{font-style:normal;background:var(--surface-3);border-radius:var(--r-sm);padding:1px 7px;
 font-size:var(--f-sm);font-weight:700;color:var(--ink)}
.warnbar{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r);
 padding:8px 11px;font-size:var(--f-sm);color:var(--warn-tx);display:flex;gap:8px;align-items:flex-start;margin-block-end:10px}
/* ==================== רספונסיבי ==================== */
@media(max-width:1180px){
 :root{--nav-w:60px}
 .nav .nt,.nav .sect,.nav .foot{display:none}
 .nav a{justify-content:center;padding-inline:0}
 .nav a .nb{position:absolute;inset-block-start:2px;inset-inline-end:4px;font-size:9px;padding:0 4px;min-width:0}
}
@media(max-width:900px){
 body{overflow:auto}
 .shell{grid-template-columns:1fr;height:auto}
 .nav{flex-direction:row;overflow-x:auto;position:sticky;inset-block-start:0;z-index:30}
 .nav a{flex-direction:column;gap:2px;padding:7px 11px;border-inline-start:0;border-block-end:3px solid transparent}
 .nav a.on{border-block-end-color:var(--acc)}
 .nav a .nt{display:block;font-size:10px;white-space:nowrap}
 .tablewrap{flex-direction:column;padding-inline:8px}
 /* במסך צר הפאנל אינו מועך את הטבלה — הוא יורד מתחתיה ברוחב מלא */
 .panel{width:auto;max-height:none}
 .stamp{display:none}
 .top{flex-wrap:wrap;height:auto;padding-block:7px;gap:7px}
}

const unk=()=>'<span class="unk" title="אין נתון בדוח">לא ידוע</span>';
const zero=n=>n>0?nf(n):'<span class="z">0</span>';
/* חומרת הבעיה — נגזרת מהמנוע (sev/cat), לא מחושבת כאן */
function sevTag(r){
 if(r.burn)return'<span class="tag crit">● חוסר ללקוח</span>';
 if(r.custGap)return'<span class="tag crit">● כיסוי חלקי ללקוח</span>';
 if(r.cat==='חשד אזילה'||r.cat==='אוזל החודש')return'<span class="tag warn">▲ סיכון לחוסר</span>';
 if(r.cat==='מעקב אספקה')return'<span class="tag warn">▲ אספקה לבירור</span>';
 if(r.paramFix)return'<span class="tag param">◆ המלצת MRP</span>';
 if(r.cat==='מלאי מת'||r.cat==='מלאי איטי'||r.cat==='עודף מלאי')return'<span class="tag neutral">■ '+esc(r.cat)+'</span>';
 return'<span class="tag neutral">■ '+esc(r.cat)+'</span>'}
/* מצב הטיפול — ציר נפרד לחלוטין מהחומרה.
   בהדגמה הוא נגזר מסימון קיים; «חדש/החמיר» רק כשיש השוואה תקפה. */
function stateTag(r){
 if(r.mark==='handled')return'<span class="tag done">✓ טופל</span>';
 if(r.mark)return'<span class="tag neutral">◷ '+esc(r.mark)+'</span>';
 if(r.po>0&&!r.etaHas)return'<span class="tag warn">◷ ממתין לספק</span>';
 if(r.po>0)return'<span class="tag acc">◷ הוזמן</span>';
 return'<span class="tag neutral">◦ חדש</span>'}
/* ETA — רק אם קיים בדוח. רכש בלי תאריך אינו הופך לתאריך מומצא. */
function etaCell(r){
 if(r.etaHas&&r.etaFirst)return`<span class="n">${esc(r.etaFirst.slice(5).split('-').reverse().join('.'))}</span>`
   +(r.etaQty?`<span class="z" style="font-size:var(--f-xs)"> · ${nf(r.etaQty)} יח׳</span>`:'');
 if(r.po>0)return'<span class="tag warn">⚑ ללא תאריך</span>';
 return'<span class="z">—</span>'}
</script>


<script>

<script>
/* ==================== מסך 1 · מרכז העבודה ====================

<script>
/* ==================== מסך 2 · רכש ואספקות ====================
   ההפרדה המרכזית: כמות שהוזמנה אינה כמות שתגיע בזמן. רכש בלי ETA
   אינו ממוקם על ציר תאריכים — הוא יושב בדלי נפרד «ללא תאריך», כי
   תאריך מומצא הוא הדבר המסוכן ביותר שמסך כזה יכול לעשות. */
function supplyTimeline(){
 const dated=IT.filter(r=>r.etaHas&&r.etaQty>0);
 const noD=IT.filter(r=>r.po>0&&!r.etaHas);
 const byWeek={};
 dated.forEach(r=>{const d=r.etaFirst||'';const k=d.slice(0,7);
   (byWeek[k]=byWeek[k]||{u:0,n:0});byWeek[k].u+=r.etaQty;byWeek[k].n++});
 const keys=Object.keys(byWeek).sort();
 const mx=Math.max(1,...keys.map(k=>byWeek[k].u),noD.reduce((a,r)=>a+r.po,0));
 const noU=noD.reduce((a,r)=>a+r.po,0);
 return `<div class="tl">
  ${keys.map(k=>{const o=byWeek[k];const w=Math.max(9,o.u/mx*100);
   const [y,m]=k.split('-');
   return `<div class="tlrow"><span class="tk">${HE[+m-1]||m} ${y}</span>
    <div><div class="tlbar planned" style="width:${w}%" title="מתוכנן לפי דוח ETA">
     ${nf(o.u)} יח׳ · ${o.n} מק״ט</div></div></div>`}).join('')}
  <div class="tlrow"><span class="tk" style="color:var(--warn-tx)">ללא תאריך</span>
   <div><div class="tlbar nodate" style="width:${Math.max(9,noU/mx*100)}%"
     title="רכש פתוח שאין לו שורה בדוח ה-ETA">${nf(noU)} יח׳ · ${noD.length} מק״ט</div></div></div>
 </div>
 <div class="chartnote">
  <span><i class="swatch" style="background:var(--done)"></i> בפועל — התקבל</span>
  <span><i class="swatch" style="background:var(--acc);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 3px,transparent 3px 6px)"></i> מתוכנן — יש ETA</span>
  <span><i class="swatch" style="background:var(--surface-3);border:1px dashed var(--warn-line)"></i> ללא תאריך — לא ממוקם על הציר</span>
 </div>`}

const SUPPLY_COLS=[
 ['pn','מק״ט','f1'],['desc','תיאור','f2'],['sup','ספק',''],
 ['free','מלאי פנוי','num'],['cust','דרישת לקוח','num'],['po','רכש פתוח','num'],
 ['transfer','בהעברה','num'],['stuck','לא משובץ','num'],['eta','ETA',''],
 ['act','הפעולה הנדרשת',''],['state','מצב טיפול','']];

   <span class="demo">נתוני הדגמה סינתטיים</span></div>
  <div class="kpis">
   <div class="kpi warn"><span class="kl">🚚 רכש ללא ETA</span><span class="kv">${nf(K.noEta)}</span>
    <span class="ks">${nf(K.noEtaUnits)} יח׳ · אין תאריך הגעה</span></div>
   <div class="kpi acc"><span class="kl">📅 משובץ בדוח ETA</span><span class="kv">${nf(K.etaParts)}</span>
    <span class="ks">${nf(K.etaRows)} שורות אספקה</span></div>
   <div class="kpi warn"><span class="kl">⌛ כמות לא משובצת</span><span class="kv">${nf(K.stuck)}</span>
    <span class="ks">רכש פתוח שאין מולו שורת אספקה</span></div>

   </section>
   <div class="tcard">
    <div class="tscroll"><table><thead><tr>

    </tr></thead><tbody>
     ${rows.map(r=>`<tr data-pn="${esc(r.pn)}">
      <td class="f1"><span class="pn">${esc(r.pn)}</span></td>
      <td class="f2"><span class="desc">${esc(r.desc)}</span></td>
      <td>${esc(r.sup)}</td>
      <td class="num">${zero(r.free)}</td>
      <td class="num ${r.cust>0?'cell-crit':''}">${zero(r.cust)}</td>
      <td class="num">${zero(r.po)}</td>
      <td class="num">${zero(r.transfer)}</td>
      <td class="num ${r.stuck>0?'cell-warn':''}">${zero(r.stuck)}</td>
      <td>${etaCell(r)}</td>
      <td><span class="act">${esc((r.act||[])[0]||'—')}</span></td>
      <td>${stateTag(r)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="tfoot"><span>${rows.length} פריטים עם רכש או אספקה</span>
     <span style="margin-inline-start:auto">«לא משובץ» = רכש פתוח שאין מולו שורה בדוח ה-ETA</span></div>
   </div>
  </div>`}
</script>

<script>
/* ==================== גרפים ==================== */
/* צריכה חודשית — סדרה אחת (עובדה מדודה), ולכן בלי מקרא: הכותרת מזהה
   אותה. פיק וצניחה שהמנוע זיהה מסומנים בצבע *וגם* בסמל. */
function barsChart(r){
 const m=r.months||[];
 if(!m.length||m.every(v=>!v))
  return `<div class="missing"><b>אין היסטוריית צריכה בדוח</b>
   <span>11 חודשי הצריכה ריקים. זה מוצג כמידע חסר ולא כגרף אפסים.</span></div>`;
 const mx=Math.max(...m.map(v=>Math.max(0,v)))||1;
 return `<div class="bars">${m.map((v,i)=>{
   const h=Math.max(3,Math.round(Math.max(0,v)/mx*52));
   const spike=r.spikes&&v>0&&v>=mx*.9&&r.spikes>0;
   const drop=r.drops>0&&v===0;
   return `<div class="col"><div class="bw">
     <div class="b${spike?' spike':drop?' drop':''}" style="height:${h}px"
       title="${HE[10-i]||''}: ${nf(v)} יח׳">
       ${spike?'<span class="mk">▲</span>':drop?'<span class="mk">▼</span>':''}</div></div>
     <span class="lb">${nf(v)}</span></div>`}).reverse().join('')}</div>
  <div class="chartnote">
   <span>מהישן לחדש · סה״כ <b class="n">${nf(r.d12)}</b> יח׳ ב-11 חודשים</span>
   ${r.spikes>0?'<span style="color:var(--warn-tx)">▲ פיק שזוהה — נוטרל מחישוב הקצב</span>':''}
   ${r.drops>0?'<span style="color:var(--crit-tx)">▼ חשד אזילה</span>':''}
  </div>`}
/* קיים מול מוצע — bullet. הקידוד הוא מיקום וצורה: עמודה כהה = קיים,
   סמן משולש = מוצע. אין שני גוונים שצריך להבדיל ביניהם. */
function bulletChart(r){
 const mx=Math.max(r.rop,r.sugROP,r.ss,r.sugSS,1)*1.15;
 const row=(k,now,sug)=>{
  const d=sug-now;
  return `<div class="blt"><span class="bk">${k}</span>
   <div class="tr"><div class="now" style="width:${Math.max(1,now/mx*100)}%"></div>
    <div class="sug" style="inset-inline-start:${sug/mx*100}%" title="מוצע ${nf(sug)}"></div></div>
   <span class="bv">${nf(now)} → <b>${nf(sug)}</b>${d?` <span style="color:${d>0?'var(--param-tx)':'var(--ink-3)'}">(${d>0?'+':''}${nf(d)})</span>`:''}</span></div>`};
 return row('ROP',r.rop,r.sugROP)+row('SS',r.ss,r.sugSS)+
  `<div class="chartnote">
    <span><i class="swatch" style="background:var(--c-now)"></i> קיים ב-SAP</span>
    <span><i class="swatch" style="background:var(--c-sug)"></i> ▲ מוצע ע״י הכלי</span>
    <span>מקור SS: <b>${esc({stat:'המרכיב הסטטיסטי',sap:'רצפת ssMin',policy:'רצפת מדיניות',od:'לפי דרישה',nostock:'סטטוס שאינו לחידוש',none:'—'}[r.ssSrc]||r.ssSrc)}</b></span>
  </div>`}

/* ==================== כרטיס הפריט ==================== */
/* הסדר קבוע: הבעיה והפעולה → המספרים שהובילו אליה → צריכה →
   רכש ואספקות → פרמטרים → מה חסר. */
function panel(){
 const r=IT.find(x=>x.pn===S.sel);
 if(!r)return'<aside class="panel" hidden></aside>';
 const idx=VIEW.findIndex(x=>x.pn===r.pn);
 const kind=r.burn||r.custGap?'':r.paramFix?' p':r.cat==='מלאי מת'||r.cat==='מלאי איטי'?' g':' w';
 const miss=[];
 if(r.priceMissing)miss.push('<b>מחיר FOB חסר</b> — אי אפשר לכמת את החוסר ואת ההון הכלוא. שאר הנתונים על הפריט תקפים.');
 if(!r.etaHas&&r.po>0)miss.push(`<b>אין ETA ל-${nf(r.po)} יח׳ ברכש פתוח</b> — הכמות אינה נספרת ככיסוי בזמן, ואינה ממוקמת על ציר האספקות.`);
 miss.push('<b>הזמנות לקוח חסומות</b> — העמודה אינה בדוח, ולכן דרישת הלקוח היא חסם עליון.');
 miss.push('<b>MOQ וגודל אריזה</b> — אינם בדוח. הכמות המוצעת אינה מעוגלת לכפולת אריזה.');
 return `<aside class="panel" style="--pw:${S.pw}px">
  <div class="pgrip" id="grip" title="שינוי רוחב"></div>
  <div class="phead">
   <span class="pn">${esc(r.pn)}</span>
   <span class="tag neutral">סוג MRP ${esc(r.mrp)}</span>
   <div class="nav2">
    <button class="iconbtn" data-step="-1" title="הפריט הקודם (↑)" aria-label="הפריט הקודם">‹</button>
    <span class="n" style="font-size:var(--f-xs);color:var(--ink-3);align-self:center">${idx+1}/${VIEW.length}</span>
    <button class="iconbtn" data-step="1" title="הפריט הבא (↓)" aria-label="הפריט הבא">›</button>
    <button class="iconbtn" data-close title="סגירה (Esc)" aria-label="סגירה">✕</button>
   </div>
  </div>
  <div class="pbody">
   <div class="problem${kind}">
    <div class="t">${sevTag(r)} ${stateTag(r)}</div>
    <div class="a">${esc((r.act||[])[0]||'אין פעולה נדרשת')}</div>
    <div class="pacts">
     <button class="pri">✓ סמן כטופל</button>
     <button>הוסף לרשימת ספק</button>
     <button>העתק מק״ט</button></div>
   </div>
   <div class="nums">
    <div><div class="k">דרישת לקוח</div><div class="v">${nf(r.cust)}</div></div>
    <div><div class="k">מלאי פנוי</div><div class="v">${nf(r.free)}</div></div>
    <div><div class="k">רכש פתוח</div><div class="v">${nf(r.po)}</div></div>
    <div><div class="k">בהעברה</div><div class="v">${nf(r.transfer)}</div></div>
    <div class="gap"><div class="k">פער</div><div class="v">${nf(r.miss)}</div></div>
   </div>
   <section class="psec"><h3>מה הוביל להחלטה</h3><div class="in">
    <div class="reasons">${(r.why||[]).map(w=>`<div class="reason ${esc(w[0])}">
      <span class="ri">${({err:'✖',warn:'▲',ok:'✔',info:'ℹ',idea:'💡'})[w[0]]||'ℹ'}</span>
      <span>${w[1]}</span></div>`).join('')||'<span class="z">—</span>'}</div></div></section>
   <section class="psec"><h3>צריכה — 11 חודשים</h3><div class="in">${barsChart(r)}</div></section>
   <section class="psec"><h3>רכש ואספקות</h3><div class="in">
    <div class="kv">
     <span class="lbl">רכש פתוח</span><span>${nf(r.po)} יח׳</span>
     <span class="lbl">משובץ בדוח ETA</span><span>${r.etaHas?nf(r.etaQty)+' יח׳':unk()}</span>
     <span class="lbl">תאריך הגעה ראשון</span><span>${r.etaFirst?esc(r.etaFirst.split('-').reverse().join('.')):unk()}</span>
     <span class="lbl">לא משובץ</span><span class="${r.stuck>0?'cell-warn':''}">${nf(r.stuck)} יח׳</span>
     <span class="lbl">זמן אספקה</span><span>${nf(r.ltD)} ימים</span>
    </div></div></section>
   <section class="psec"><h3>פרמטרים — קיים מול מוצע</h3><div class="in">${bulletChart(r)}</div></section>
   <section class="psec"><h3>מה חסר ומה הונח</h3><div class="in">
    <div class="missing">${miss.map(m=>'<span>'+m+'</span>').join('')}</div></div></section>
  </div></aside>`}
</script>

<script>
/* ==================== מסך 3 · חוסרים ולקוחות ====================
   עמודות ברירת המחדל הן בדיוק מה שהמפרט דורש, וכל אחת מהן היא שדה
   של המנוע — לא כמות שנחלצה מטקסט של המלצה. */
const SHORT_COLS=[
 {k:'pn',  t:'מק״ט',        cls:'f1'},
 {k:'desc',t:'תיאור',       cls:'f2'},
 {k:'sev', t:'הבעיה',       cls:''},
 {k:'free',t:'מלאי פנוי',   cls:'num'},
 {k:'cust',t:'דרישת לקוח',  cls:'num'},
 {k:'po',  t:'רכש פתוח',    cls:'num'},
 {k:'transfer',t:'בהעברה',  cls:'num'},
 {k:'miss',t:'פער',         cls:'num'},
 {k:'eta', t:'ETA',         cls:''},
 {k:'act', t:'הפעולה הנדרשת',cls:''},
 {k:'state',t:'מצב טיפול',  cls:''}];
const FILTERS=[
 {id:'burn',  t:'אין רכש',       f:r=>r.burn},
 {id:'part',  t:'כיסוי חלקי',    f:r=>r.custGap&&!r.burn},
 {id:'noeta', t:'רכש ללא ETA',   f:r=>r.po>0&&!r.etaHas},
 {id:'eta',   t:'יש ETA',        f:r=>r.etaHas&&r.etaQty>0},
 {id:'mrp',   t:'המלצת MRP',     f:r=>r.paramFix}];
let VIEW=[];
function rowsFor(){
 let rows=IT.filter(r=>r.miss>0||r.cust>0||r.custGap||r.burn);
 for(const id of S.filters){const F=FILTERS.find(x=>x.id===id);if(F)rows=rows.filter(F.f)}
 const k=S.sort.k,dir=S.sort.dir==='desc'?-1:1;
 return rows.sort((a,b)=>{const x=a[k],y=b[k];
   return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'he'))*dir})}

function screenShort(){
 VIEW=rowsFor();
 const units=VIEW.reduce((a,r)=>a+(r.miss||0),0);
 const byCur={};VIEW.forEach(r=>{const c=r.cur||'—';byCur[c]=(byCur[c]||0)+(r.miss||0)*(r.price||0)});
 return `<div class="crumb"><h1>חוסרים ולקוחות</h1>
   <span class="sub">הזמנות לקוח שאינן מכוסות, וחוסר צפוי החודש</span>
   <button class="kpitog" id="ktog">${S.nokpi?'▾ הצג מדדים':'▴ קפל מדדים'}</button>
   <span class="demo">נתוני הדגמה סינתטיים</span></div>
  <div class="kpis">
   <div class="kpi crit"><span class="kl">🔥 ללא רכש כלל</span>
    <span class="kv">${nf(IT.filter(r=>r.burn).length)}</span><span class="ks">ההבטחה ניתנה, אין מולה כלום</span></div>
   <div class="kpi crit"><span class="kl">👤 כיסוי חלקי</span>
    <span class="kv">${nf(IT.filter(r=>r.custGap&&!r.burn).length)}</span><span class="ks">רכש פתוח שאינו סוגר את הפער</span></div>
   <div class="kpi warn"><span class="kl">⚠ יח׳ ללא כיסוי</span>
    <span class="kv">${nf(units)}</span><span class="ks money">${moneyMix(byCur)}</span></div>
  </div>
  <div class="fbar">
   ${FILTERS.map(f=>`<button class="chip${S.filters.has(f.id)?' on':''}" data-filt="${f.id}">
     ${esc(f.t)}${S.filters.has(f.id)?'<span class="x">✕</span>':''}</button>`).join('')}
   <span class="grow"></span>
   <div class="seg" role="group" aria-label="צפיפות">
    <button data-dense="0" class="${S.dense?'':'on'}">רגיל</button>
    <button data-dense="1" class="${S.dense?'on':''}">צפוף</button></div>
   <button class="chip">▦ עמודות</button>
   <button class="chip">⭳ ייצוא התצוגה</button>
  </div>
  <div class="tablewrap">
   <div class="tcard"><div class="tscroll" id="scroll"><table><thead><tr>
    ${SHORT_COLS.map(c=>`<th class="${c.cls}" data-sort="${c.k}">${esc(c.t)}${S.sort.k===c.k?(S.sort.dir==='desc'?' ▾':' ▴'):''}</th>`).join('')}
   </tr></thead><tbody>
    ${VIEW.map(r=>`<tr data-pn="${esc(r.pn)}" class="${S.sel===r.pn?'sel':''}" tabindex="0">
     <td class="f1"><span class="pn">${esc(r.pn)}</span></td>
     <td class="f2"><span class="desc">${esc(r.desc)}</span></td>
     <td>${sevTag(r)}</td>
     <td class="num">${zero(r.free)}</td>
     <td class="num ${r.cust>0?'cell-crit':''}">${zero(r.cust)}</td>
     <td class="num">${zero(r.po)}</td>
     <td class="num">${zero(r.transfer)}</td>
     <td class="num ${r.miss>0?'cell-crit':''}">${r.priceMissing&&!r.miss?unk():zero(r.miss)}</td>
     <td>${etaCell(r)}</td>
     <td><span class="act" title="${esc((r.act||[])[0]||'')}">${esc((r.act||[])[0]||'—')}</span></td>
     <td>${stateTag(r)}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="tfoot"><span><b>${VIEW.length}</b> שורות</span>
    <span>${nf(units)} יח׳ ללא כיסוי</span>
    <span class="money">${moneyMix(byCur)}</span>
    <span style="margin-inline-start:auto">↑↓ מעבר · Enter פתיחה · Esc סגירה</span></div>
   </div>
   ${panel()}
  </div>`}

/* מסכים שטרם נבנו בתצוגה הזאת — מצב ריק כן, לא עמוד שבור */
function stub(t,sub,n){return `<div class="crumb"><h1>${esc(t)}</h1>
  <span class="sub">${esc(sub)}</span><span class="demo">נתוני הדגמה סינתטיים</span></div>
 <div class="center"><div class="card"><div class="empty">
  <span class="ei">◱</span><b>${nf(n)} פריטים בתחום הזה</b><br>
  המסך הזה אינו חלק משלוש התצוגות שהוגשו לאישור הכיוון.<br>
  הפריסה שלו זהה: רצועת מדדים · סינון · טבלה רחבה · פאנל פריט.
 </div></div></div>`}

/* ==================== ציור וקישוריות ==================== */
function render(){
 const scr=S.screen;
 const body=scr==='center'?screenCenter()
  :scr==='short'?screenShort()
  :scr==='supply'?screenSupply()
  :scr==='mrp'?stub('תכנון ו-MRP','ROP ו-SS — קיים מול מוצע, רצפות ומגמות',K.paramFix)
  :scr==='health'?stub('בריאות המלאי','עודף, מלאי איטי, מלאי מת והון כלוא',K.excess)
  :stub('קטלוג פריטים','חיפוש ובדיקה של כל הפריטים',K.total);
 document.getElementById('app').innerHTML=topBar()+
  `<div class="shell">${navBar()}<main class="work">${body}</main></div>`;
 document.body.classList.toggle('tight',S.dense);
 document.body.classList.toggle('nokpi',S.nokpi&&S.screen==='short');
 wire()}
function go(id){S.screen=id;if(id!=='short')S.sel=null;render();
 document.querySelector('.work h1')?.focus?.()}
function open(pn){S.sel=pn;render();
 document.querySelector('tr.sel')?.scrollIntoView({block:'nearest'})}
function step(d){const i=VIEW.findIndex(x=>x.pn===S.sel);
 const n=VIEW[Math.min(VIEW.length-1,Math.max(0,i+d))];if(n)open(n.pn)}
function wire(){
 document.querySelectorAll('[data-go]').forEach(e=>e.onclick=ev=>{ev.preventDefault();go(e.dataset.go)});
 document.querySelectorAll('tr[data-pn],[data-pn].qrow').forEach(e=>e.onclick=()=>{
   if(S.screen!=='short'){S.screen='short';S.filters.clear()}open(e.dataset.pn)});
 document.querySelectorAll('[data-filt]').forEach(e=>e.onclick=()=>{
   S.filters.has(e.dataset.filt)?S.filters.delete(e.dataset.filt):S.filters.add(e.dataset.filt);render()});
 document.querySelectorAll('[data-dense]').forEach(e=>e.onclick=()=>{S.dense=e.dataset.dense==='1';render()});
 document.querySelectorAll('[data-sort]').forEach(e=>e.onclick=()=>{
   const k=e.dataset.sort;if(['sev','eta','act','state'].includes(k))return;
   S.sort=S.sort.k===k?{k,dir:S.sort.dir==='desc'?'asc':'desc'}:{k,dir:'desc'};render()});
 document.querySelectorAll('[data-step]').forEach(e=>e.onclick=()=>step(+e.dataset.step));
 document.querySelector('[data-close]')?.addEventListener('click',()=>{S.sel=null;render()});
 const kt=document.getElementById('ktog');
 if(kt)kt.onclick=()=>{S.nokpi=!S.nokpi;render()};
 const th=document.getElementById('thBtn');
 if(th)th.onclick=()=>{S.theme=S.theme==='light'?'dark':'light';
   document.documentElement.dataset.theme=S.theme;th.textContent=S.theme==='dark'?'◑':'◐'};
 const g=document.getElementById('grip');
 if(g)g.onpointerdown=ev=>{ev.preventDefault();g.setPointerCapture(ev.pointerId);
   const x0=ev.clientX,w0=S.pw;
   const mv=e2=>{S.pw=Math.min(620,Math.max(300,w0+(e2.clientX-x0)));
     document.querySelector('.panel').style.setProperty('--pw',S.pw+'px')};
   const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up)};
   g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up)};
}
addEventListener('keydown',e=>{
 if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
 if(e.key==='Escape'&&S.sel){S.sel=null;render();return}
 if(S.screen!=='short')return;
 if(e.key==='ArrowDown'){e.preventDefault();S.sel?step(1):open(VIEW[0]&&VIEW[0].pn)}
 if(e.key==='ArrowUp'){e.preventDefault();step(-1)}
 if(e.key==='Enter'&&!S.sel&&VIEW[0]){e.preventDefault();open(VIEW[0].pn)}});
render();
</script>
</body></html>
